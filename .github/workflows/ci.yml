# CI pipeline for What The Food.
# Runs on every push and pull request to main/dev.
# Three jobs run in order:
#   1. frontend-lint   — installs Node dependencies and runs ESLint
#   2. backend-test    — installs Python dependencies and runs pytest
#   3. docker-build    — builds both images to verify the Dockerfiles are valid (no push)

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontend-lint:
    name: Frontend — Install & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  backend-test:
    name: Backend — Install & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/app/requirements.txt
            backend/app/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          grep -v '^torch==' backend/app/requirements.txt > /tmp/requirements-no-torch.txt
          pip install -r /tmp/requirements-no-torch.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r backend/app/requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests -v

  docker-build:
    name: Docker — Build Check
    runs-on: ubuntu-latest
    needs: [frontend-lint, backend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max