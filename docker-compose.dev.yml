services:
  model-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "python",
        "-c",
        "from transformers import CLIPModel, CLIPProcessor; import os; model_id = os.getenv('MODEL_ID', 'openai/clip-vit-base-patch32'); CLIPModel.from_pretrained(model_id); CLIPProcessor.from_pretrained(model_id)",
      ]
    volumes:
      - huggingface_data:/root/.cache/huggingface


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONPATH: /app/backend
    depends_on:
      model-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - huggingface_data:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  frontend-node-modules:
  huggingface_data:
